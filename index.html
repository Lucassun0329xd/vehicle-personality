/* =========================================================
   使用者答案
========================================================= */

let answers = [];

let currentResult = null;


/* =========================================================
   顯示頁面
========================================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   開始測驗
========================================================= */

function startQuiz() {

    answers = new Array(
        questions.length
    ).fill(null);

    renderQuestions();

    showScreen("quizScreen");
}


/* =========================================================
   產生題目
========================================================= */

function renderQuestions() {

    const container =
        document.getElementById("questions");

    container.innerHTML = "";

    questions.forEach(
        (question, questionIndex) => {

            const questionDiv =
                document.createElement("div");

            questionDiv.className = "question";

            const number =
                document.createElement("div");

            number.className =
                "question-number";

            number.textContent =
                `第 ${questionIndex + 1} 題`;

            const title =
                document.createElement("div");

            title.className =
                "question-title";

            title.textContent =
                question.text;

            const answersDiv =
                document.createElement("div");

            answersDiv.className =
                "answers";


            question.options.forEach(
                (option, optionIndex) => {

                    const button =
                        document.createElement("button");

                    button.type = "button";

                    button.className =
                        "answer-btn";

                    button.textContent =
                        option;


                    /*
                     * 非常重要：
                     *
                     * 每一顆按鈕只控制自己。
                     *
                     * 即使第一顆和第二顆
                     * 都算「左邊」，
                     * 它們仍然不會一起亮。
                     */

                    button.addEventListener(
                        "click",
                        function() {

                            /*
                             * 只清除同一題
                             * 的所有 selected
                             */

                            answersDiv
                                .querySelectorAll(
                                    ".answer-btn"
                                )
                                .forEach(btn => {
                                    btn.classList
                                        .remove(
                                            "selected"
                                        );
                                });


                            /*
                             * 只讓自己亮
                             */

                            button.classList
                                .add("selected");


                            /*
                             * 記錄真正的
                             * 第幾個選項
                             *
                             * 0 = 非常同意
                             * 1 = 同意
                             * 2 = 不同意
                             * 3 = 非常不同意
                             */

                            answers[
                                questionIndex
                            ] = optionIndex;

                        }
                    );


                    answersDiv.appendChild(
                        button
                    );

                }
            );


            questionDiv.appendChild(
                number
            );

            questionDiv.appendChild(
                title
            );

            questionDiv.appendChild(
                answersDiv
            );

            container.appendChild(
                questionDiv
            );

        }
    );
}


/* =========================================================
   計算結果
========================================================= */

function finishQuiz() {

    const error =
        document.getElementById(
            "errorMessage"
        );


    /*
     * 確認全部 12 題都有回答
     */

    const missing =
        answers.some(
            answer => answer === null
        );


    if (missing) {

        error.style.display =
            "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        return;
    }


    error.style.display =
        "none";


    /*
     * Q1
     *
     * 0 / 1 = 左
     * 2 / 3 = 右
     *
     * 左 = 外向
     * 右 = 內向
     */

    const social =
        answers[0] <= 1
            ? "外向"
            : "內向";


    /*
     * Q2
     *
     * 左 = 冒險
     * 右 = 穩健
     */

    const adventure =
        answers[1] <= 1
            ? "冒險"
            : "穩健";


    /*
     * Q3
     *
     * 左 = 宏觀大局
     * 右 = 細節
     */

    const bigPicture =
        answers[2] <= 1
            ? "宏觀大局"
            : "細節";


    const key =
        `${social}-${adventure}-${bigPicture}`;


    currentResult =
        results[key];


    if (!currentResult) {

        alert(
            "找不到這組結果，請重新測驗。"
        );

        return;
    }


    showResult();

}


/* =========================================================
   顯示結果
========================================================= */

function showResult() {

    document.getElementById(
        "resultTitle"
    ).textContent =
        `你是一臺${currentResult.name}`;


    document.getElementById(
        "resultTraits"
    ).textContent =
        currentResult.traits;


    document.getElementById(
        "resultTraits2"
    ).textContent =
        currentResult.traits;


    document.getElementById(
        "resultAnalysis"
    ).textContent =
        currentResult.analysis;


    document.getElementById(
        "resultImage"
    ).src =
        currentResult.image;


    showScreen(
        "resultScreen"
    );


    /*
     * 完成一次後才記錄
     */

    recordResult(
        currentResult.name
    );
}


/* =========================================================
   下載結果圖片
========================================================= */

async function downloadResult() {

    if (!currentResult) {
        return;
    }


    const image =
        new Image();

    image.crossOrigin =
        "anonymous";


    image.onload =
        function() {

            /*
             * 4:5 圖片
             *
             * 上面增加標題
             */

            const width =
                1200;

            const imageHeight =
                1500;

            const titleHeight =
                180;

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.width =
                width;

            canvas.height =
                imageHeight +
                titleHeight;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            /*
             * 白色背景
             */

            ctx.fillStyle =
                "#ffffff";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * 標題
             */

            ctx.fillStyle =
                "#111111";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.font =
                "bold 65px Microsoft JhengHei, sans-serif";

            ctx.fillText(
                `你是一臺${currentResult.name}`,
                width / 2,
                titleHeight / 2
            );


            /*
             * 圖片
             */

            ctx.drawImage(
                image,
                0,
                titleHeight,
                width,
                imageHeight
            );


            /*
             * 下載
             */

            canvas.toBlob(
                function(blob) {

                    const url =
                        URL.createObjectURL(
                            blob
                        );

                    const a =
                        document.createElement(
                            "a"
                        );

                    a.href =
                        url;

                    a.download =
                        `你是一臺${currentResult.name}.jpg`;

                    document.body
                        .appendChild(a);

                    a.click();

                    a.remove();

                    URL.revokeObjectURL(
                        url
                    );

                },
                "image/jpeg",
                0.95
            );

        };


    image.onerror =
        function() {

            alert(
                "圖片無法讀取，請確認 results 資料夾中的圖片名稱是否正確。"
            );

        };


    image.src =
        currentResult.image;

}


/* =========================================================
   統計
========================================================= */


/*
 * 如果沒有設定 Supabase，
 * 先使用瀏覽器自己的 localStorage。
 *
 * 這樣網站即使還沒設定 Supabase
 * 也可以正常測驗。
 */

function getLocalStats() {

    let data =
        localStorage.getItem(
            "vehicleQuizStats"
        );


    if (!data) {

        data = {
            total: 0,
            results: {}
        };

        Object.values(results)
            .forEach(result => {

                data.results[
                    result.name
                ] = 0;

            });

        localStorage.setItem(
            "vehicleQuizStats",
            JSON.stringify(data)
        );

    } else {

        data =
            JSON.parse(data);

    }


    return data;
}


function saveLocalResult(
    resultName
) {

    const data =
        getLocalStats();


    data.total++;


    if (
        typeof data.results[
            resultName
        ] !== "number"
    ) {

        data.results[
            resultName
        ] = 0;

    }


    data.results[
        resultName
    ]++;


    localStorage.setItem(
        "vehicleQuizStats",
        JSON.stringify(data)
    );


    updateHomeTotal(
        data.total
    );

}


/* =========================================================
   記錄結果
========================================================= */

async function recordResult(
    resultName
) {

    /*
     * 已設定 Supabase
     */

    if (supabaseClient) {

        const {
            error
        } =
        await supabaseClient.rpc(
            "record_result",
            {
                p_result_name:
                    resultName
            }
        );


        if (!error) {

            await loadStats();

            return;

        }

        console.error(
            "Supabase record error:",
            error
        );

    }


    /*
     * Supabase 沒設定或失敗
     * 使用 localStorage
     */

    saveLocalResult(
        resultName
    );

    loadStats();

}


/* =========================================================
   讀取統計
========================================================= */

async function loadStats() {

    /*
     * Supabase
     */

    if (supabaseClient) {

        try {

            const totalResponse =
                await supabaseClient
                    .from("site_stats")
                    .select(
                        "total_completed"
                    )
                    .eq("id", 1)
                    .single();


            const resultResponse =
                await supabaseClient
                    .from("result_stats")
                    .select(
                        "result_name,count"
                    );


            if (
                !totalResponse.error &&
                !resultResponse.error
            ) {

                updateHomeTotal(
                    totalResponse.data
                        .total_completed
                );


                renderStats(
                    resultResponse.data,
                    totalResponse.data
                        .total_completed
                );


                return;

            }

        } catch (error) {

            console.error(
                "Supabase load error:",
                error
            );

        }

    }


    /*
     * LocalStorage
     */

    const data =
        getLocalStats();


    updateHomeTotal(
        data.total
    );


    const rows =
        Object.entries(
            data.results
        ).map(
            ([result_name, count]) => ({
                result_name,
                count
            })
        );


    renderStats(
        rows,
        data.total
    );

}


/* =========================================================
   更新首頁人數
========================================================= */

function updateHomeTotal(
    total
) {

    document.getElementById(
        "homeTotal"
    ).textContent =
        Number(total || 0)
            .toLocaleString();

}


/* =========================================================
   顯示統計
========================================================= */

function renderStats(
    rows,
    total
) {

    const list =
        document.getElementById(
            "statsList"
        );


    list.innerHTML = "";


    /*
     * 固定照這個順序
     */

    const order = [
        "卡車",
        "巴士",
        "吉普車",
        "計程車",
        "挖土機",
        "推土機",
        "水車",
        "飛機"
    ];


    order.forEach(
        name => {

            const found =
                rows.find(
                    row =>
                        row.result_name ===
                        name
                );


            const count =
                found
                    ? Number(found.count)
                    : 0;


            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "stats-row";


            row.innerHTML = `
                <span>${name}</span>
                <span>${count.toLocaleString()} 人</span>
            `;


            list.appendChild(
                row
            );

        }
    );


    document.getElementById(
        "statsTotal"
    ).textContent =
        `總完成次數：${Number(total || 0).toLocaleString()} 次`;

}


/* =========================================================
   網頁載入
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadStats();

    }
);

</script>
