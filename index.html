<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap");
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;

    background-image: url("background.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: #111;
}

/* =========================
   整體
========================= */

.page {
    min-height: 100vh;
    position: relative;
    padding: 60px 20px 30px;
}

.container {
    width: min(900px, 100%);
    margin: 0 auto;
}

/* =========================
   左上角按鈕
========================= */

.top-left {
    position: fixed;
    top: 14px;
    left: 16px;
    z-index: 100;
    display: flex;
    gap: 7px;
}

.small-link {
    display: inline-block;
    padding: 5px 10px;
    background: rgba(255,255,255,0.88);
    border: 1px solid #777;
    border-radius: 5px;
    color: #111;
    text-decoration: none;
    font-size: 13px;
    box-shadow: 1px 1px 0 rgba(0,0,0,.18);
}

.small-link:hover {
    background: white;
}

/* =========================
   首頁
========================= */

.home {
    min-height: calc(100vh - 90px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.logo-title {
    font-size: clamp(42px, 7vw, 72px);
    font-weight: 900;
    letter-spacing: 5px;
    margin: 0 0 38px;
    text-shadow:
        2px 2px 0 #fff,
        4px 4px 0 rgba(0,0,0,.12);
}

.home-button {
    min-width: 210px;
    padding: 13px 30px;
    margin: 7px;
    border: 2px solid #111;
    border-radius: 7px;
    background: #fff;
    color: #111;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 3px 3px 0 #111;
    transition: .1s;
}

.home-button:hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 #111;
}

.home-button:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #111;
}

/* 完成數字 */

.total-small {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(0,0,0,.55);
}

/* =========================
   頁面切換
========================= */

.screen {
    display: none;
}

.screen.active {
    display: block;
    animation: screenFadeIn .45s ease forwards;
}

.screen.fade-out {
    animation: screenFadeOut .3s ease forwards;
}

@keyframes screenFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes screenFadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

/* =========================
   關於
========================= */

.about-box {
    max-width: 600px;
    margin: 100px auto;
    background: rgba(255,255,255,.9);
    border: 2px solid #222;
    border-radius: 10px;
    padding: 35px;
    text-align: center;
    box-shadow: 5px 5px 0 rgba(0,0,0,.15);
}

.about-box h2 {
    margin-top: 0;
    font-size: 32px;
}

.about-box p {
    font-size: 18px;
    line-height: 1.8;
}

.back-button {
    margin-top: 20px;
    padding: 9px 20px;
    border: 1px solid #222;
    border-radius: 5px;
    background: white;
    cursor: pointer;
}

/* =========================
   測驗
========================= */

.quiz-header {
    max-width: 800px;
    margin: 0 auto 25px;
    text-align: center;
}

.quiz-header h1 {
    font-size: 36px;
    margin: 0 0 10px;
}

.quiz-header p {
    margin: 0;
    color: #555;
}

.question {
    max-width: 800px;
    margin: 0 auto 22px;
    padding: 25px;
    background: rgba(255,255,255,.94);
    border: 1px solid #888;
    border-radius: 9px;
    box-shadow: 3px 3px 0 rgba(0,0,0,.12);
}

.question-number {
    font-size: 14px;
    color: #777;
    margin-bottom: 7px;
}

.question-title {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.6;
    margin-bottom: 20px;
}

/* =========================
   四個答案
   注意：
   四個按鈕完全獨立
========================= */

.answers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

.answer-btn {
    min-height: 60px;
    padding: 10px 5px;
    border: 2px solid #555;
    border-radius: 6px;
    background: #fff;
    color: #111;
    font-size: 15px;
    cursor: pointer;
    transition: .12s;
}

/* 滑過 */

.answer-btn:hover {
    background: #f1f1f1;
}

/* 只有「自己」被選到才亮 */

.answer-btn.selected {
    background: #111;
    color: white;
    border-color: #111;
    transform: translateY(-2px);
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
}

/* 防止 disabled 時被其他樣式影響 */

.answer-btn:focus {
    outline: none;
}

.quiz-submit {
    display: block;
    margin: 30px auto 70px;
    padding: 13px 40px;
    border: 2px solid #111;
    border-radius: 7px;
    background: #111;
    color: white;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.quiz-submit:hover {
    background: #333;
}

.error-message {
    display: none;
    max-width: 800px;
    margin: 0 auto 15px;
    padding: 10px;
    background: #ffe1e1;
    border: 1px solid #c00;
    color: #900;
    text-align: center;
    border-radius: 5px;
}

/* =========================
   分析中
========================= */

.analysis-loading-page {
    min-height: calc(100vh - 90px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.analysis-loading-title {
    font-size: clamp(32px, 6vw, 54px);
    font-weight: 900;
    margin: 0 0 25px;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,.12);
}

.loading-dots {
    font-size: 22px;
    font-weight: bold;
    background: rgba(255,255,255,.88);
    border: 2px solid #222;
    border-radius: 8px;
    padding: 12px 22px;
    box-shadow: 3px 3px 0 rgba(0,0,0,.15);
}

.loading-spinner {
    width: 38px;
    height: 38px;
    margin: 0 auto 18px;
    border: 4px solid rgba(0,0,0,.18);
    border-top-color: #111;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* =========================
   結果

.result-subtitle {

    aspect-ratio: 4 / 5;

    border: 2px solid #111;
    display: block;

/* =========================================================
   顯示頁面
========================================================= */

function showScreen(id) {

    const current = document.querySelector(".screen.active");
    const next = document.getElementById(id);

    if (!next || current === next) {
        if (next) {
            next.classList.remove("fade-out");
            next.classList.add("active");
        }
        return;
    }

    if (current) {
        current.classList.add("fade-out");

        setTimeout(function() {
            current.classList.remove("active", "fade-out");
            next.classList.remove("fade-out");
            next.classList.add("active");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }, 300);
    } else {
        next.classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
}


/* =========================================================
   開始測驗
========================================================= */

function startQuiz() {

    answers = new Array(
        questions.length
    ).fill(null);

    renderQuestions();

    showScreen("quizScreen");
}


/* =========================================================
   產生題目
========================================================= */

function shuffle(array) {
    const copied = [...array];
    for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
    }
    return copied;
}

function renderQuestions() {

    const container = document.getElementById("questions");
    container.innerHTML = "";

    const shuffledQuestions = shuffle(questions);

    shuffledQuestions.forEach((question, displayIndex) => {

        const questionDiv = document.createElement("div");
        questionDiv.className = "question";

        const number = document.createElement("div");
        number.className = "question-number";
        number.textContent = `第 ${displayIndex + 1} 題`;

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = question.text;

        const answersDiv = document.createElement("div");
        answersDiv.className = "answers";

        question.options.forEach((option, optionIndex) => {

            const button = document.createElement("button");
            button.type = "button";
            button.className = "answer-btn";
            button.textContent = option;

            button.addEventListener("click", function() {

                answersDiv.querySelectorAll(".answer-btn").forEach(btn => {
                    btn.classList.remove("selected");
                });

                button.classList.add("selected");

                // 用原始 question.id 儲存，確保亂序後 Q1～Q3 仍正確計分。
                answers[questions.indexOf(question)] = Number(optionIndex);
            });

            answersDiv.appendChild(button);
        });

        questionDiv.appendChild(number);
        questionDiv.appendChild(title);
        questionDiv.appendChild(answersDiv);
        container.appendChild(questionDiv);
    });
}


/* =========================================================
   計算結果
========================================================= */

function finishQuiz() {

    const error =
        document.getElementById(
            "errorMessage"
        );


    /*
     * 確認全部 12 題都有回答
     */

    /*
     * 直接檢查畫面上的每一題是否真的有選中的按鈕。
     * 題目即使隨機排列，也不會誤判。
     */
    const questionCards =
        document.querySelectorAll(".question");

    const missing =
        questionCards.length !== questions.length ||
        Array.from(questionCards).some(
            card => !card.querySelector(".answer-btn.selected")
        );


    if (missing) {

        error.style.display =
            "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        return;
    }


    error.style.display =
        "none";


    /*
     * 保險確認 Q1～Q3 的答案確實已記錄。
     */
    if (
        answers[0] == null ||
        answers[1] == null ||
        answers[2] == null
    ) {
        error.style.display = "block";
        error.textContent = "答案沒有成功記錄，請重新點選一次。";
        return;
    }

    /*
     * Q1
     *
     * 0 / 1 = 左
     * 2 / 3 = 右
     *
     * 左 = 外向
     * 右 = 內向
     */

    const social =
        answers[0] <= 1
            ? "外向"
            : "內向";


    /*
     * Q2
     *
     * 左 = 冒險
     * 右 = 穩健
     */

    const adventure =
        answers[1] <= 1
            ? "冒險"
            : "穩健";


    /*
     * Q3
     *
     * 左 = 宏觀大局
     * 右 = 細節
     */

    const bigPicture =
        answers[2] <= 1
            ? "宏觀大局"
            : "細節";


    const key =
        `${social}-${adventure}-${bigPicture}`;


    currentResult =
        results[key];


    if (!currentResult) {

        alert(
            "找不到這組結果，請重新測驗。"
        );

        return;
    }


    showScreen("nameScreen");

    const nameInput = document.getElementById("userNameInput");
    const nameError = document.getElementById("userNameError");
    nameInput.value = "";
    nameError.style.display = "none";
    setTimeout(function() {
        nameInput.focus();
    }, 150);

}


/* =========================================================
   填寫名字後進入結果
========================================================= */

function submitUserName() {

    const input = document.getElementById("userNameInput");
    const error = document.getElementById("userNameError");
    const value = input.value.trim();

    if (!value) {
        error.textContent = "請輸入名字";
        error.style.display = "block";
        input.focus();
        return;
    }

    userName = value.slice(0, 8);
    error.style.display = "none";

    showScreen("analysisScreen");

    setTimeout(function() {
        showResult();
    }, 2500);
}


/* =========================================================
   顯示結果
========================================================= */

function showResult() {

    document.getElementById(
        "resultTitle"
    ).textContent =
        `你是一臺${currentResult.name}`;


    drawResultCanvas();


    showScreen(
        "resultScreen"
    );


    /*
     * 完成一次後才記錄
     */

    recordResult(
        currentResult.name
    );
}


/* =========================================================
   在結果圖片內放入使用者名字
========================================================= */

function drawResultCanvas() {

    if (!currentResult) {
        return;
    }

    const canvas =
        document.getElementById("resultImage");

    const ctx =
        canvas.getContext("2d");

    const image =
        new Image();

    image.onload = function() {

        const width = image.naturalWidth || 1200;
        const height = image.naturalHeight || 1500;

        canvas.width = width;
        canvas.height = height;

        ctx.drawImage(image, 0, 0, width, height);

        /*
         * 蓋掉原本圖片裡的示範名字與
         *「（像是這樣 字體是仿宋體）」這句話。
         * 這一塊位於黑板左上方。
         */
        ctx.fillStyle = "#242424";
        ctx.fillRect(45, 105, width * 0.48, 205);

        /* 使用者名字放在黑板左上方 */
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = 'bold 86px FangSong, "仿宋", "Microsoft JhengHei", serif';

        let displayName = userName || "";
        if (displayName.length > 8) {
            displayName = displayName.slice(0, 8);
        }

        /* 長名字自動縮小，避免超出黑板區域 */
        const maxNameWidth = width * 0.43;
        while (ctx.measureText(displayName).width > maxNameWidth && parseInt(ctx.font) > 40) {
            const size = parseInt(ctx.font) - 4;
            ctx.font = `bold ${size}px FangSong, "仿宋", "Microsoft JhengHei", serif`;
        }

        ctx.fillText(displayName, 70, 125);
    };

    image.onerror = function() {
        console.error("結果圖片無法讀取：", currentResult.image);
    };

    image.src = currentResult.image;
}



/* =========================================================
   下載結果圖片
========================================================= */

async function downloadResult() {

    if (!currentResult) {
        return;
    }

    const canvas =
        document.getElementById("resultImage");

    if (!canvas.width) {
        drawResultCanvas();
        setTimeout(downloadResult, 300);
        return;
    }

    canvas.toBlob(function(blob) {

        if (!blob) {
            alert("圖片製作失敗，請再試一次。");
            return;
        }

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;
        a.download = `你是一臺${currentResult.name}_${userName || "匿名"}.jpg`;

        document.body.appendChild(a);
        a.click();
        a.remove();

        URL.revokeObjectURL(url);

    }, "image/jpeg", 0.95);
}



/* =========================================================
   統計
========================================================= */


/*
 * 如果沒有設定 Supabase，
 * 先使用瀏覽器自己的 localStorage。
 *
 * 這樣網站即使還沒設定 Supabase
 * 也可以正常測驗。
 */

function getLocalStats() {

    let data =
        localStorage.getItem(
            "vehicleQuizStats"
        );


    if (!data) {

        data = {
            total: 0,
            results: {}
        };

        Object.values(results)
            .forEach(result => {

                data.results[
                    result.name
                ] = 0;

            });

        localStorage.setItem(
            "vehicleQuizStats",
            JSON.stringify(data)
        );

    } else {

        data =
            JSON.parse(data);

    }


    return data;
}


function saveLocalResult(
    resultName
) {

    const data =
        getLocalStats();


    data.total++;


    if (
        typeof data.results[
            resultName
        ] !== "number"
    ) {

        data.results[
            resultName
        ] = 0;

    }


    data.results[
        resultName
    ]++;


    localStorage.setItem(
        "vehicleQuizStats",
        JSON.stringify(data)
    );


    updateHomeTotal(
        data.total
    );

}


/* =========================================================
   記錄結果
========================================================= */

async function recordResult(
    resultName
) {

    /*
     * 同一個瀏覽器只計入第一次完成測驗。
     * 可以重測、可以看結果，但不會再次增加統計。
     */
    const FIRST_COMPLETION_KEY = "vehicleQuizFirstCompleted";

    if (localStorage.getItem(FIRST_COMPLETION_KEY) === "1") {
        await loadStats();
        return;
    }

    /*
     * 已設定 Supabase
     */

    if (supabaseClient) {

        const {
            error
        } =
        await supabaseClient.rpc(
            "record_result",
            {
                p_result_name:
                    resultName
            }
        );


        if (!error) {

            /* 只有成功寫入 Supabase 後才標記為已計入。 */
            localStorage.setItem(
                "vehicleQuizFirstCompleted",
                "1"
            );

            await loadStats();

            return;

        }

        console.error(
            "Supabase record error:",
            error
        );

    }


    /*
     * Supabase 沒設定或失敗
     * 使用 localStorage
     */

    saveLocalResult(
        resultName
    );

    /* localStorage 模式成功記錄後也鎖定第一次。 */
    localStorage.setItem(
        "vehicleQuizFirstCompleted",
        "1"
    );

    loadStats();

}


/* =========================================================
   讀取統計
========================================================= */

async function loadStats() {

    /*
     * Supabase
     */

    if (supabaseClient) {

        try {

            const totalResponse =
                await supabaseClient
                    .from("site_stats")
                    .select(
                        "total_completed"
                    )
                    .eq("id", 1)
                    .single();


            const resultResponse =
                await supabaseClient
                    .from("result_stats")
                    .select(
                        "result_name,count"
                    );


            if (
                !totalResponse.error &&
                !resultResponse.error
            ) {

                updateHomeTotal(
                    totalResponse.data
                        .total_completed
                );


                renderStats(
                    resultResponse.data
                );


                return;

            }

        } catch (error) {

            console.error(
                "Supabase load error:",
                error
            );

        }

    }


    /*
     * LocalStorage
     */

    const data =
        getLocalStats();


    updateHomeTotal(
        data.total
    );


    const rows =
        Object.entries(
            data.results
        ).map(
            ([result_name, count]) => ({
                result_name,
                count
            })
        );


    renderStats(
        rows
    );

}


/* =========================================================
   更新首頁人數
========================================================= */

function updateHomeTotal(
    total
) {

    document.getElementById(
        "homeTotal"
    ).textContent =
        Number(total || 0)
            .toLocaleString();

}


/* =========================================================
   顯示統計
========================================================= */

function renderStats(
    rows
) {

    const list =
        document.getElementById(
            "statsList"
        );


    list.innerHTML = "";


    /*
     * 固定照這個順序
     */

    const order = [
        "卡車",
        "巴士",
        "吉普車",
        "計程車",
        "挖土機",
        "推土機",
        "水車",
        "飛機"
    ];


    order.forEach(
        name => {

            const found =
                rows.find(
                    row =>
                        row.result_name ===
                        name
                );


            const count =
                found
                    ? Number(found.count)
                    : 0;


            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "stats-row";


            row.innerHTML = `
                <span>${name}</span>
                <span>${count.toLocaleString()} 人</span>
            `;


            list.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   網頁載入
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadStats();

    }
);

</script>
